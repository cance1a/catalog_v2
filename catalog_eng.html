<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grupo Ribeiro & Moreira - Catálogo</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    width: 100vw;
    overflow: auto;
    font-family: Arial, sans-serif;
    background: #212121;
    color: #fff;
    min-height: 100vh;
    box-sizing: border-box;
  }
  body.light {
    background: #f0f0f0;
    color: #212121;
  }
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 110px;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0 12px 0;
    z-index: 100;
    box-sizing: border-box;
  }
  body.light .sidebar {
    background: #e0e0e0;
    color: #212121;
  }
  .menu {
    display: flex;
    flex-direction: column;
    gap: 22px;
    align-items: center;
    width: 100%;
  }
  .sidebar img.logo-small {
    width: 44px;
    height: 44px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .menu-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    color: #bbb;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    user-select: none;
    transition: color 0.3s;
    width: 100%;
    text-align: center;
    min-height: 54px;
  }
  .menu-item:hover,
  .menu-item.active {
    color: #2c752c;
  }
  body.light .menu-item {
    color: #555;
  }
  body.light .menu-item:hover,
  body.light .menu-item.active {
    color: #1a5d1a;
  }
  .menu-item img.icon {
    width: 26px;
    height: 26px;
    margin-bottom: 4px;
    object-fit: contain;
    display: block;
  }
  .languages {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 2px;
    width: 100%;
    align-items: center;
  }
  .language-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid transparent;
    box-shadow: 0 0 8px 2px transparent;
    cursor: pointer;
    transition: box-shadow 0.3s, border-color 0.3s;
    margin-bottom: 0;
  }
  .language-btn.active,
  .language-btn:hover {
    box-shadow: 0 0 8px 2px #2c752c;
    border-color: #2c752c;
  }
  .language-btn img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
  .front, .section {
    margin-left: 110px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .front {
    background: url('img/background/background_2.jpg') center/cover no-repeat;
  }
  body.light .front {
    background: none;
    background-color: #dbeadf;
  }
  .logo {
    position: absolute;
    top: 28px;
    right: 36px;
    width: 130px;
  }
  h1 {
    font-size: 2.3em;
    margin: 0;
  }
  p {
    font-size: 1.2em;
    margin-top: 12px;
  }
  .option {
    padding: 10px 18px;
    font-size: 1.1em;
    margin: 8px 0;
    background: rgba(44,117,44,0.74);
    border-radius: 5px;
    cursor: pointer;
    border: none;
    color: #fff;
    transition: background 0.2s;
  }
  .option:hover {
    background: rgba(44,117,44,0.93);
  }
  body.light .option {
    background: rgba(44,117,44,0.54);
    color: #eee;
  }
  body.light .option:hover {
    background: rgba(44,117,44,0.75);
    color: white;
  }
  .gate-category-list {
    display: flex;
    gap: 30px;
    margin-bottom: 28px;
    margin-top: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .gate-category-btn {
    padding: 11px 26px;
    font-size: 1em;
    font-weight: 700;
    border-radius: 9px;
    border: none;
    background: #263b30;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
    box-shadow: 0 2px 8px #1a1b1a10;
  }
  .gate-category-btn:hover,
  .gate-category-btn.active {
    background: #2c752c;
    color: #fff;
    box-shadow: 0 2px 16px #1a5d1a30;
  }
  body.light .gate-category-btn {
    background: #d5ead5;
    color: #263b30;
  }
  body.light .gate-category-btn:hover,
  body.light .gate-category-btn.active {
    background: #1a5d1a;
    color: #fff;
  }
  .section {
    padding: 30px 10px 10px 10px;
    margin-bottom: 16px;
    display: none;
    width: calc(100vw - 110px);
    box-sizing: border-box;
    min-height: calc(100vh - 40px);
  }
  .project-list {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 10px;
    justify-content: center;
    width: 100%;
  }
  .project {
    background: #232a2e;
    border-radius: 8px;
    padding: 13px;
    width: 220px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s, transform 0.4s;
    color: #fff;
    box-sizing: border-box;
    min-height: 260px;
    max-width: 100%;
  }
  body.light .project {
    background: #f1f1f1;
    color: #202020;
  }
  .project.show {
    opacity: 1;
    transform: translateY(0);
  }
  .project img {
    width: 100%;
    border-radius: 4px;
    max-height: 130px;
    object-fit: cover;
    margin-bottom: 8px;
  }
  #project-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.8);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
  }
  body.light #project-modal {
    background: rgba(255, 255, 255, 0.9);
  }
  #project-modal .modal-content {
    position: relative;
    background: #212121;
    padding: 18px;
    border-radius: 8px;
    max-width: 92vw;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
    overflow: hidden;
  }
  body.light #project-modal .modal-content {
    background: #fff;
    color: #222;
  }
  #project-modal img {
    max-width: 85vw;
    max-height: 48vh;
    border-radius: 4px;
    cursor: grab;
    touch-action: none;
    margin-bottom: 10px;
  }
  #project-modal .modal-desc {
    margin-top: 5px;
    text-align: center;
    max-width: 90vw;
    word-wrap: break-word;
  }
  @media (max-width: 650px) {
    .sidebar {
      width: 60px;
    }
    .front,
    .section {
      margin-left: 60px;
    }
    .section {
      width: calc(100vw - 60px);
    }
    .project {
      width: 96vw;
      min-width: unset;
    }
  }
  @media (max-width: 450px) {
    .sidebar {
      width: 38px;
    }
    .front,
    .section {
      margin-left: 38px;
    }
    .section {
      width: calc(100vw - 38px);
    }
    .project {
      width: 98vw;
    }
    .menu-item span,
    .menu-item {
      font-size: 9px;
    }
  }
</style>

<div class="sidebar" aria-label="Main sidebar" role="navigation">

      <span id="menu-sm-label">Soluções Metálicas</span>
    </div>
  </div>
  <div class="languages" role="navigation" aria-label="Language selection">

    </div>
  </div>
</div>

<div class="front" id="Home" role="main" aria-label="Home section">
  <img src="img/logo_rb/logo_1.webp" alt="Logo Ribeiro & Moreira" class="logo" />
  <div>
    <h1 id="title-main">Bem-vindo ao Grupo Ribeiro & Moreira</h1>
    <p id="subtitle-main">Construções Metálicas, Soluções Metálicas</p>
    <button class="option" id="btn-aluminio" onclick="showSection('Aluminum')">Alumínio</button>
    <button class="option" id="btn-construcoes" onclick="showSection('MetalConstructions')">Construções</button>
    <button class="option" id="btn-solucoes" onclick="showSection('MetalSolutions')">Soluções Metálicas</button>

  </div>
</div>

<div id="sections-container" aria-live="polite"></div>

<div id="project-modal" aria-hidden="true" aria-labelledby="modal-description" role="dialog">
  <div class="modal-content" role="document">
    <img id="modal-img" src="" alt="Project image" />
    <button id="btn-fullscreen" title="Tela cheia" aria-label="Tela cheia" style="
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(44,117,44,0.7);
      border: none;
      border-radius: 4px;
      color: white;
      padding: 4px 8px;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
      user-select: none;
    ">
      ⛶
    </button>
    <div class="modal-desc" id="modal-description"></div>
  </div>
</div>

  function createProjectCard(projKey, projData) {
    const projDiv = document.createElement('div');
    projDiv.className = 'project';
    projDiv.onclick = () => openModal(projKey);

    const img = document.createElement('img');
    img.src = projData.images && projData.images.length > 0 ? projData.images[0] : '';
    img.alt = projData.title[currentLang] || 'Project image';
    projDiv.appendChild(img);

    const titleDiv = document.createElement('div');
    titleDiv.className = 'project-title';
    titleDiv.id = 'title-' + projKey;
    titleDiv.innerText = projData.title[currentLang] || '';
    projDiv.appendChild(titleDiv);

    const descDiv = document.createElement('div');
    descDiv.className = 'project-desc';
    descDiv.id = 'desc-' + projKey;
    descDiv.innerText = projData.descriptions[currentLang] || '';
    projDiv.appendChild(descDiv);

    return projDiv;
  }

  const container = document.getElementById('sections-container');

  Object.entries(sectionsInfo).forEach(([key, value]) => {
    const section = document.createElement('div');
    section.id = key;
    section.className = 'section';

    const h2 = document.createElement('h2');
    h2.innerText = value.name;
    section.appendChild(h2);

    if (value.categories) {
      const catList = document.createElement('div');
      catList.className = 'gate-category-list';

      value.categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'gate-category-btn';
        btn.innerText = cat.titles[currentLang] || cat.id;
        btn.onclick = () => {
          if (key === 'Gates') {
            showGateProjects(cat.id, btn);
          } else if (key === 'Aluminum') {
            showAluminumProjects(cat.id, btn);
          }
        };
        btn.id = (key === 'Gates' ? 'gate-cat-' : 'alum-cat-') + cat.id;
        catList.appendChild(btn);
      });

      section.appendChild(catList);

      const list = document.createElement('div');
      list.className = 'project-list';
      list.id = key === 'Gates' ? 'gate-project-list' : 'alum-project-list';
      section.appendChild(list);
    } else {
      const list = document.createElement('div');
      list.className = 'project-list';

      Object.entries(projectsData).forEach(([projKey, projData]) => {
        if (projKey.startsWith(value.prefix)) {
          const projDiv = createProjectCard(projKey, projData);
          list.appendChild(projDiv);
        }
      });

      section.appendChild(list);
    }

    container.appendChild(section);
  });

  function showAluminumProjects(categoryId, btn) {
  const list = document.getElementById('alum-project-list');
  const cat = aluminumCategories.find(c => c.id === categoryId);

  // limpar estado ativo anterior
  document.querySelectorAll('#alum-categories .gate-category-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  // limpar lista antes de carregar
  list.innerHTML = '';
  if (!cat) return;

  // gerar projetos que correspondem ao prefixo da categoria
  Object.entries(projectsData).forEach(([key, proj]) => {
    if (key.startsWith(cat.prefix)) {
      const div = createProjectCard(key, proj);
      list.appendChild(div);
    }
  });

  // animar entrada
  list.querySelectorAll('.project').forEach((proj, i) => {
    setTimeout(() => proj.classList.add('show'), i * 120);
  });
}


function showGateProjects(categoryId, btn) {
  const list = document.getElementById('gate-project-list');
  const cat = gateCategories.find(c => c.id === categoryId);

  // limpar estado ativo anterior
  document.querySelectorAll('#gate-categories .gate-category-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  // limpar lista antes de carregar
  list.innerHTML = '';
  if (!cat) return;

  // gerar projetos que correspondem ao prefixo da categoria
  Object.entries(projectsData).forEach(([key, proj]) => {
    if (key.startsWith(cat.prefix)) {
      const div = createProjectCard(key, proj);
      list.appendChild(div);
    }
  });

  // animar entrada
  list.querySelectorAll('.project').forEach((proj, i) => {
    setTimeout(() => proj.classList.add('show'), i * 120);
  });
}



  function showSection(sectionId) {
    const home = document.getElementById('Home');
    const allSections = [...document.querySelectorAll('.section'), home];
    allSections.forEach(sec => {
      if (!sec) return;
      if (sec.id !== sectionId) {
        sec.style.display = 'none';
        sec.querySelectorAll('.project').forEach(p => p.classList.remove('show'));
      }
    });

    const newSec = sectionId === 'Home' ? home : document.getElementById(sectionId);
    if (!newSec) return;

    newSec.style.display = sectionId === 'Home' ? 'flex' : 'block';

    if (sectionId !== 'Home') {
      if (sectionId === 'Gates') {
        if (currentGateCategory) {
          showGateProjects(currentGateCategory, document.getElementById('gate-cat-' + currentGateCategory));
        }
      }
      if (sectionId === 'Aluminum') {
        if (currentAluminumCategory) {
          showAluminumProjects(currentAluminumCategory, document.getElementById('alum-cat-' + currentAluminumCategory));
        }
      }
      const projects = newSec.querySelectorAll('.project');
      projects.forEach((proj, i) => {
        setTimeout(() => proj.classList.add('show'), i * 150);
      });
    }

    document.querySelectorAll('.menu-item').forEach(mi => mi.classList.remove('active'));
    const menuMap = { Home: 'icon-home', Aluminum: 'icon-al', MetalConstructions: 'icon-co', MetalSolutions: 'icon-sm', Gates: 'icon-po', Claraboias: 'icon-cla' };
    const menuId = menuMap[sectionId];
    if (menuId) {
      const el = document.getElementById(menuId);
      if (el) el.classList.add('active');
    }
  }

    currentLang = lang;

      const key = titleDiv.id.replace('title-', '');
      if (projectsData[key] && projectsData[key].title) {
        titleDiv.innerText = projectsData[key].title[lang] || '';
      }
    });

    document.querySelectorAll('.project-desc').forEach((descDiv) => {
      const key = descDiv.id.replace('desc-', '');
      if (projectsData[key] && projectsData[key].descriptions) {
        descDiv.innerText = projectsData[key].descriptions[lang] || '';
      }
    });

      const btn = document.getElementById('gate-cat-' + cat.id);
      if (btn) btn.innerText = cat.titles[lang] || cat.id;
    });

      if (btn) btn.innerText = cat.titles[lang] || cat.id;

  // Modal control functions
  let modalProject = null;
  let modalIndex = 0;

  function openModal(projKey) {
    modalProject = projKey;
    modalIndex = 0;
    updateModal();
    const modal = document.getElementById('project-modal');
    modal.style.display = 'flex';
    modal.setAttribute('aria-hidden', 'false');
  }

  function closeModal() {
    const modal = document.getElementById('project-modal');
    modal.style.display = 'none';
    modal.setAttribute('aria-hidden', 'true');
    modalProject = null;
    modalIndex = 0;
  }

  function updateModal() {
    if (!modalProject) return;
    const proj = projectsData[modalProject];
    if (!proj) return;
    const imgEl = document.getElementById('modal-img');
    const descEl = document.getElementById('modal-description');
    imgEl.src = proj.images && proj.images[modalIndex] ? proj.images[modalIndex] : '';
    descEl.innerText = proj.descriptions && proj.descriptions[currentLang] ? proj.descriptions[currentLang] : '';
  }

  function modalPrev() {
    if (!modalProj/ect) return;
    const imgCount = (projectsData[modalProject].images || []).length;
    if (imgCount === 0) return;
    modalIndex = (modalIndex - 1 + imgCount) % imgCount;
    updateModal();
  }

  function modalNext() {
    if (!modalProject) return;
    const imgCount = (projectsData[modalProject].images || []).length;
    if (imgCount === 0) return;
    modalIndex = (modalIndex + 1) % imgCount;
    updateModal();
  }

  document.getElementById('project-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
    else if (e.key === 'ArrowLeft') modalPrev();
    else if (e.key === 'ArrowRight') modalNext();
  });

// Controle amélioré do modal-img para pinch-to-zoom e swipe separados, e opção fullscreen ao clicar
(function() {
  const modalImg = document.getElementById('modal-img');
  let startX = 0, endX = 0, isDragging = false;
  let lastTouchDistance = null;

  modalImg.style.cursor = 'pointer';

  // Detecta o início do touch
  modalImg.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      startX = e.touches[0].clientX;
      isDragging = true;
      lastTouchDistance = null;
    } else if (e.touches.length === 2) {
      // Pinch zoom começa
      isDragging = false;
      lastTouchDistance = getTouchDistance(e.touches);
      // Define transform origin para o centro do gesto
      let centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      let centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const rect = modalImg.getBoundingClientRect();
      const originX = ((centerX - rect.left) / rect.width) * 100;
      const originY = ((centerY - rect.top) / rect.height) * 100;
      modalImg.style.transformOrigin = `${originX}% ${originY}%`;
    }
  }, { passive: false });

  // Detecta movimento do touch
  modalImg.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && isDragging) {
      endX = e.touches[0].clientX;
    } else if (e.touches.length === 2) {
      e.preventDefault(); // impede scroll da página
      let currentDistance = getTouchDistance(e.touches);
      let scale = 1;
      if (lastTouchDistance) {
        scale = currentDistance / lastTouchDistance;
      }
      lastTouchDistance = currentDistance;

      const currentTransform = window.getComputedStyle(modalImg).transform;
      let matrix = currentTransform === 'none' ? [1,0,0,1,0,0] : currentTransform.match(/matrix3d\((.+)\)/) ? currentTransform.match(/matrix3d\((.+)\)/)[1].split(', ') : currentTransform.match(/matrix\((.+)\)/)[1].split(', ');
      let currentScaleX = parseFloat(matrix[0]);
      let currentScaleY = parseFloat(matrix[3]);
      let newScaleX = currentScaleX * scale;
      let newScaleY = currentScaleY * scale;
      newScaleX = Math.min(Math.max(1, newScaleX), 4);
      newScaleY = Math.min(Math.max(1, newScaleY), 4);
      modalImg.style.transform = `scale(${newScaleX}, ${newScaleY})`;
    }
  }, { passive: false });

  // Detecta fim do toque para swipe
  modalImg.addEventListener('touchend', e => {
    if (!isDragging) return;
    isDragging = false;
    const diffX = endX - startX;
    const threshold = 50;
    if (Math.abs(diffX) > threshold) {
      if (diffX > 0) modalPrev();
      else modalNext();
    }
    endX = 0;
    startX = 0;
  });

  // Função auxiliar para distância entre dois toques
  function getTouchDistance(touches) {
    const [touch1, touch2] = touches;
    const dx = touch2.clientX - touch1.clientX;
    const dy = touch2.clientY - touch1.clientY;
    return Math.hypot(dx, dy);
  }

  // Toggle tela cheia ao clicar
  modalImg.addEventListener('click', () => {
    // Se a imagem estiver zoomada (>1), resetar zoom ao clicar
    const currentTransform = modalImg.style.transform;
    if (currentTransform && currentTransform !== '' && currentTransform !== 'scale(1)') {
      modalImg.style.transform = 'scale(1)';
      return;
    }

    // Se não for fullscreen, ativa fullscreen, se for, sai
    if (!document.fullscreenElement) {
      if (modalImg.requestFullscreen) modalImg.requestFullscreen();
      else if (modalImg.webkitRequestFullscreen) modalImg.webkitRequestFullscreen();
      else if (modalImg.msRequestFullscreen) modalImg.msRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
    }
  });

  // Reset zoom ao sair do fullscreen
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      modalImg.style.transform = 'scale(1)';
      modalImg.style.transformOrigin = '50% 50%';
    }
  });
})();
